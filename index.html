<style>
:root{color-scheme:light;--bg:#e8eaeb;--surf:#fff;--ink:#1a2228;--mut:#58656e;--line:#c5cdd2;--acc:#0e6670;--acc2:#fff;--brass:#a8690f;--ok:#216343;--okbg:#dff0e6;--hint:#7d5410;--hintbg:#f7ebd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181c;--surf:#1b242a;--ink:#edf1f3;--mut:#a0adb5;--line:#38454d;--acc:#6fc3cc;--acc2:#0c1a1d;--brass:#e0a54a;--ok:#8fd3ae;--okbg:#1b3327;--hint:#e8c27e;--hintbg:#392f18}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181c;--surf:#1b242a;--ink:#edf1f3;--mut:#a0adb5;--line:#38454d;--acc:#6fc3cc;--acc2:#0c1a1d;--brass:#e0a54a;--ok:#8fd3ae;--okbg:#1b3327;--hint:#e8c27e;--hintbg:#392f18}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.5 "Atkinson Hyperlegible","Segoe UI",Verdana,sans-serif}
main{max-width:700px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:30px;margin:0 0 6px}h2{font-size:23px;margin:0 0 10px}p{margin:0 0 12px}.mut{color:var(--mut);font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}.top b{font-size:22px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tab{flex:1;min-width:110px;min-height:52px;font-size:17px;font-weight:700;background:var(--surf);border:2px solid var(--line);border-radius:12px;padding:6px 8px}.tab.on{background:var(--acc);color:var(--acc2);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.toc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:58px;padding:10px 14px;margin-bottom:8px;background:var(--surf);border:2px solid var(--line);border-radius:12px;text-align:left;font-size:20px;font-weight:700}
.toc-row:hover{border-color:var(--acc)}.toc-pg{color:var(--mut);font-size:16px;font-weight:600;white-space:nowrap}
.job{display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:92px;padding:12px;background:var(--surf);border:2px solid var(--line);border-radius:12px;font-size:19px;font-weight:600}
.job:hover{border-color:var(--acc)}.job .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.job small{display:block;opacity:.75;font-size:15px;font-weight:500}
.job.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.job.done .no{background:var(--ok);color:var(--acc2)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.note{border-left:6px solid var(--brass)}.note small{display:block;color:var(--mut);font-size:16px}
.voice-box{border-left:6px solid var(--acc);background:var(--surf)}
.stg{color:var(--mut);font-size:17px;margin-bottom:2px}
.cue{font-size:24px;font-weight:700}.cat{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 12px;font-size:16px;color:var(--mut);margin-top:8px}
.item-card{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surf);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.item-main{display:flex;align-items:center;gap:12px;flex:1;background:transparent;border:0;padding:4px;text-align:left;font-size:22px;font-weight:700}
.item-main .e{font-size:34px;flex:none}
.spk-btn{flex:none;min-width:52px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:22px;display:inline-flex;align-items:center;justify-content:center}
.spk-btn:hover{border-color:var(--acc)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;margin-bottom:10px;padding:10px 16px;text-align:left;font-size:23px;font-weight:700;background:var(--surf);border:2px solid var(--line);border-radius:12px}
.opt .e{font-size:36px;flex:none}.opt:hover{border-color:var(--acc)}.opt[disabled]{opacity:.42;border-style:dashed;cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.opt.glow{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}.opt.sent{font-size:22px}
.prim{display:block;width:100%;min-height:60px;padding:12px;font-size:20px;font-weight:700;background:var(--acc);color:var(--acc2);border:0;border-radius:12px;margin-top:6px}
.ghost{min-height:54px;padding:8px 14px;font-size:18px;background:transparent;border:2px solid var(--line);border-radius:12px}
.row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.hint,.ok{border-radius:10px;padding:10px 14px;font-weight:700;margin-bottom:10px;font-size:19px}.hint{background:var(--hintbg);color:var(--hint)}.ok{background:var(--okbg);color:var(--ok)}
.seq{font-size:21px}.sl{display:flex;align-items:center;gap:10px;min-height:54px;border:2px dashed var(--line);border-radius:10px;padding:6px 12px;margin-bottom:6px;color:var(--mut)}.sl.f{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.big{font-size:56px;text-align:center;line-height:1.2}.say{font-size:28px;font-weight:700;margin:4px 0 12px}
.banner{background:var(--okbg);border:2px solid var(--ok);color:var(--ok);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.banner-txt{font-size:28px;font-weight:700;margin:6px 0 10px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
textarea{width:100%;font:inherit;font-size:21px;line-height:1.45;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.ov{position:fixed;inset:0;background:var(--bg);z-index:9;padding:22px;overflow:auto;display:flex;flex-direction:column;justify-content:center;max-width:700px;margin:0 auto}
.ov .t{font-size:32px;font-weight:700;text-align:center;margin-bottom:12px}.hide{display:none!important}
</style>
</head>

function hint(){
 if(st.done)return;var d=cur,K=st.K;st.c++;st.hn++;
 if(K=="q"){var n=st.btns.filter(function(x){return x.dataset.t==d.d[st.nx]})[0];if(n)n.classList.add("glow");msg("İşaretli kart sıradaki adım.","hint");return}
 if(K=="b"&&st.L==3&&st.h==0){st.h=1;msg(st.tg.cue,"hint");return}
 if(K=="b"&&st.h<2){st.h=2;msg("İlk harf: "+st.tg.w.charAt(0).toUpperCase(),"hint");return}
 var w=st.btns.filter(function(x){return x.dataset.ok=="0"&&!x.disabled})[0];
 if(w){w.disabled=true;msg("Bir seçenek elendi.","hint")}
}

function fin(star){
 st.done=true;st.btns.forEach(function(x){x.disabled=true});if(st.K=="r")$("opts").innerHTML="";
 completeStage(star);
}

function completeStage(star){
 if(st.spokenDone)return;
 st.spokenDone=true;
 $("voice_box").innerHTML="";
 var d=cur,L=st.L,last=s==plan(L).length-1,ex="";
 lg[o][(pi[o]||0)*8+s]=[st.e,st.hn,st.spoken?1:0];pl[o]=L;
 var fl=false;if(last){pi[o]=(pi[o]||0)+1;fl=pi[o]>=3;if(fl)got[o]=d.e;var n=lg[o].reduce(function(a,b){return b?a+b[0]+b[1]:a},0);
  if(fl&&n<=4&&L<3){lv[o]=L+1;ex='<div class="hint">Bir sonraki oynayışta destek azalacak (Düzey '+(L+1)+').</div>'}}
 save();
 var vNote=st.spoken?" Sözel üretim denendi.":" Sözel üretim atlandı.";
 msg(st.K=="r"?(star?"Tamam."+vNote:"Geçildi."+vNote):st.c==0?"Doğru. İpucu kullanmadınız."+vNote:"Doğru. "+(st.hn?st.hn+" ipucuyla":"")+(st.hn&&st.e?", ":"")+(st.e?st.e+" yanlış denemeyle":"")+" tamamlandı."+vNote,"ok");
 $("nxt").innerHTML=ex+(fl?'<p class="mut" style="margin:10px 0 6px">Bu görev nasıldı?</p><div class="row"><button class="ghost" data-f="1">Rahat</button><button class="ghost" data-f="2">Biraz zor</button><button class="ghost" data-f="3">Çok zor</button></div>':'<button class="prim" id="nx">'+(last?"Sonraki soru":"Devam")+'</button>');
 if(fl)[].forEach.call(document.querySelectorAll("[data-f]"),function(b){b.onclick=function(){cf[o]=+b.dataset.f;save();home()}});else $("nx").onclick=function(){if(last)s=0;else s++;stage()};
}

function molaMenu(){
 ov.innerHTML='<div class="t">Mola / Kolaylaştır</div><button class="opt" id="m1">Devam et</button><button class="opt" id="m2">Kolaylaştır (daha fazla destek)</button><button class="opt" id="m3">ADİS Defterine geç</button><button class="opt" id="m4">Mola ver</button>';ov.classList.remove("hide");
 $("m1").onclick=function(){ov.classList.add("hide")};
 $("m2").onclick=function(){kol++;lv[o]=Math.max(1,(lv[o]||1)-1);save();ov.classList.add("hide");if(mainTab=="extra"){s=0;stage()}else if(mainTab=="write"){writeView()}else{bookView()}};
 $("m3").onclick=function(){save();ov.classList.add("hide");mainTab="book";curPageId=null;bookView()};
 $("m4").onclick=function(){mola++;save();ov.innerHTML='<div class="t">Mola</div><p class="mut" style="text-align:center">Acele yok. Hazır olduğunuzda devam edin.</p><button class="prim" id="m5">Devam et</button>';$("m5").onclick=function(){ov.classList.add("hide")}};
}

function repair(){
 var h='<div class="t">İletişim yardımı (ADİS Onarım)</div>';R.forEach(function(r,i){h+='<button class="opt" data-r="'+i+'">'+r[0]+'</button>'});
 ov.innerHTML=h+'<button class="ghost" id="cx">Kapat</button>';ov.classList.remove("hide");
 [].forEach.call(ov.querySelectorAll("[data-r]"),function(b){b.onclick=function(){rep++;save();var r=R[b.dataset.r];speak(r[0]);ov.innerHTML='<div class="t">'+r[0]+' <button class="spk-btn" id="rp_sp" aria-label="Sesli oku">🔊</button></div><p class="mut" style="text-align:center">'+r[1]+'</p><button class="prim" id="cx">Devam et</button>';$("rp_sp").onclick=function(){speak(r[0])};$("cx").onclick=function(){ov.classList.add("hide")}}});
 $("cx").onclick=function(){ov.classList.add("hide")};
}

function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function clin(){
 var r="",T=0,AE=0,AH=0,SV=0;
 O.forEach(function(d,i){if(lg[i]&&lg[i].length){var e=0,h=0,ok=0,cn=0,sv=0;lg[i].forEach(function(a){if(!a)return;cn++;e+=a[0];h+=a[1];T++;if(!a[0])AE++;if(!a[1])AH++;if(!a[0]&&!a[1])ok++;if(a[2]==1){sv++;SV++}});r+="<tr><td>"+d.n+"</td><td>"+(pl[i]||1)+"</td><td>"+ok+"/"+cn+"</td><td>"+sv+"/"+cn+"</td><td>"+e+"</td><td>"+h+"</td><td>"+["–","Rahat","Biraz zor","Çok zor"][cf[i]||0]+"</td></tr>"}});
 var nl="";notes.forEach(function(x,i){nl+='<div class="card"><div class="mut">'+x.t+'</div><p style="margin:6px 0;white-space:pre-wrap">'+esc(x.x)+'</p><button class="ghost" data-d="'+i+'">Sil</button></div>'});
 app.innerHTML=head()+navTabs()+'<h1>Klinisyen paneli</h1><div class="card"><b>Oturum Özeti</b><p class="mut">Tamamlanan ek görev: '+nd()+'/'+O.length+(T?'. Bağımsız aşama: '+(AE+AH)+'/'+T+' · Sözel üretim: '+SV+'/'+T:"")+'. Defter kullanımı: '+aacUse+' · Yazarak ifade: '+writeUse+' · Onarım: '+rep+' · Mola: '+mola+' · Kolaylaştırma: '+kol+'.</p><div style="overflow-x:auto"><table><tr><th>Ek Görev</th><th>Düzey</th><th>Hatasız</th><th>Sözel</th><th>Yanlış</th><th>İpucu</th><th>Rahatlık</th></tr>'+(r||"<tr><td colspan=7>Henüz oynanmadı.</td></tr>")+'</table></div><p class="mut" style="margin-top:10px">Birincil alan: ADİS Defteri ve Yazarak İfade. Ek Pratik: günlük/iş görevleri ve her seçimde sözel üretim.</p></div><div class="card"><b>Klinisyen notu</b><textarea id="nt" rows="3" placeholder="Oturum notunu yazın"></textarea><button class="prim" id="sv">Notu kaydet</button></div>'+nl+'<button class="prim" id="bk">Giriş ekranına dön</button><button class="ghost" id="rs" style="width:100%;margin-top:14px">İlerlemeyi sıfırla (notlar kalır)</button>';
 bindNav();
 $("bk").onclick=welcome;
 $("sv").onclick=function(){var v=$("nt").value.trim();if(!v)return;notes.unshift({t:new Date().toLocaleString("tr-TR"),x:v});save();clin()};
 [].forEach.call(app.querySelectorAll("[data-d]"),function(b){b.onclick=function(){notes.splice(+b.dataset.d,1);save();clin()}});
 $("rs").onclick=function(){var b=$("rs");if(b.dataset.a){got=[];lv=[];sc=[];lg=[];cf=[];pl=[];pi=[];rep=0;mola=0;kol=0;aacUse=0;writeUse=0;save();bookView()}else{b.dataset.a=1;b.textContent="Emin misiniz? Tekrar dokunun"}};
}
load();welcome();
</script>
</body>
</html>
